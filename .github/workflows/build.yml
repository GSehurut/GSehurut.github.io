name: Build and check site

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (GitHub Pages gem set)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check internal links, images and alt text
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
